services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimapp
      POSTGRES_PASSWORD: claimapp
      POSTGRES_DB: claimapp
    ports:
      - "5432:5432"
    volumes:
      - claimapp_pgdata:/var/lib/postgresql/data

volumes:
  claimapp_pgdata:
